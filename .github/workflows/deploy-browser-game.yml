name: Deploy browser game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt

      - name: Install browser build tools
        run: python -m pip install -r requirements-web.txt

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Build WebAssembly game
        run: >-
          python -m pygbag --build --width 900 --height 700
          --title "Tower Defense" --ume_block 0 .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload browser game
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
