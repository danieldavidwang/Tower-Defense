name: Daily Repository Maintenance

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # Runs three times per day: 13:00, 18:00, and 23:00 UTC.
    - cron: "0 13,18,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        id: syntax
        continue-on-error: true
        run: python -m compileall -q .

      - name: Generate repository metrics
        run: python scripts/repo_metrics.py

      - name: Commit changed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated/repo_metrics.json

          if git diff --cached --quiet; then
            echo "Repository metrics are unchanged."
          else
            git commit -m "chore: update repository metrics"
            git push
          fi

      - name: Open issue if syntax check fails
        if: steps.syntax.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUMBER=$(gh issue list \
            --state open \
            --search '"Automated Python syntax failure" in:title' \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$ISSUE_NUMBER" ]; then
            gh issue create \
              --title "Automated Python syntax failure" \
              --body "The scheduled repository maintenance job found a Python syntax error. Check the latest GitHub Actions run for details."
          else
            echo "An open syntax-failure issue already exists: #$ISSUE_NUMBER"
          fi

      - name: Close resolved syntax issue
        if: steps.syntax.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUMBER=$(gh issue list \
            --state open \
            --search '"Automated Python syntax failure" in:title' \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" \
              --comment "The scheduled syntax check is passing again, so this issue is being closed automatically."
          fi
